<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JoullyAI</title>
    <link rel="stylesheet" href="css/chat.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <!-- БОКОВАЯ ПАНЕЛЬ -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="logo.png" alt="JoullyAI" class="logo-img" />
                <span>JoullyAI</span>
            </div>

            <button class="new-chat-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Новый чат
            </button>

            <div class="history">
            </div>

            <div class="sidebar-footer">
                <!-- БЛОК АВТОРИЗАЦИИ -->
                <div class="auth-container" id="authContainer">
                    <!-- Неавторизованный вид -->
                    <div class="auth-login" id="authLogin">
                        <button class="auth-btn" id="googleLoginBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Войти через Google
                        </button>
                    </div>
                    
                    <!-- Авторизованный вид -->
                    <div class="auth-user" id="authUser" style="display: none;">
                        <div class="user-avatar" id="userAvatar">
                            <img src="" alt="" id="userAvatarImg" style="display: none;">
                            <span id="userAvatarLetter">U</span>
                        </div>
                        <div class="user-info">
                            <div class="user-name" id="userName">Пользователь</div>
                            <div class="user-email" id="userEmail">user@email.com</div>
                        </div>
                        <button class="logout-btn" id="logoutBtn" title="Выйти">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <main class="main">
            <header class="chat-header">
                <img src="logo.png" alt="JoullyAI" class="header-logo" />
                <div>
                    <h2>JoullyAI</h2>
                    <span>Нейросеть нового поколения</span>
                </div>
            </header>

            <div class="chat-area">
                <div class="welcome">
                    <h3>Чем могу помочь?</h3>
                    <p>Задайте вопрос или начните новый диалог</p>
                    <div class="creator-info">🤖 JoullyAI · создан qp0zen</div>
                    <div style="margin-top: 20px; font-size: 14px; color: #888;">
                        🔑 Войдите через Google, чтобы начать общение
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <footer class="chat-footer">
                <div class="input-wrapper">
                    <input type="text" id="input" placeholder="Задать вопрос..." autofocus />
                    <button id="sendBtn">→</button>
                </div>
                <div class="hint">JoullyAI может допускать ошибки</div>
            </footer>
        </main>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
